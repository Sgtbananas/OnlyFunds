# OnlyFunds 2 configuration.
# API credentials are NEVER stored here. Set them as environment variables
# (COINEX_API_KEY / COINEX_API_SECRET) or in a local .env file (git-ignored).
# They are only needed for balance checks; paper trading needs no keys.
version: 3
log_level: INFO

api:
  base_url: https://api.coinex.com
  timeout: 10
  max_retries: 3

trading:
  mode: paper            # only "paper" is supported. Live trading is locked in code.
  profile: Conservative  # Conservative | Normal | Aggressive (see profiles below)
  strategy: auto         # auto | trend_following | mean_reversion | stacked
  default_interval: 1h   # at CoinEx's 0.2% fees, shorter candles give stops too tight for the costs
  backtest_lookback: 1000
  initial_capital: 1000
  fee_rate: 0.002        # CoinEx default spot taker fee; the live market fee is used if higher
  slippage_pct: 0.0005
  stop_slippage_pct: 0.002   # stops fill worse than normal exits
  max_volume_participation: 0.10  # max fraction of the last candle's volume per order
  pairs:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  pair_universe_size: 200
  paper_refresh_seconds: 60
  trading_windows:        # optional entry window; exits always run
    enabled: false
    start_time: '09:00'
    end_time: '18:00'
    timezone: UTC

risk:
  # Conservative defaults. Profiles below override the first three fields only.
  risk_per_trade: 0.005    # fraction of equity lost if the stop is hit (fees + stop slippage included)
  max_position_pct: 0.10   # max notional per position, fraction of equity
  max_exposure_pct: 0.30   # max total open notional, fraction of equity
  max_open_positions: 3
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.10   # engages the kill switch in paper trading
  min_notional: 1.0        # USDT; smaller orders are rejected, never rounded up
  max_cost_to_risk: 0.25   # skip trades whose round-trip costs exceed 25% of the stop distance

exits:
  stop_atr_mult: 1.5
  tp_atr_mult: 3.0
  trail_atr_mult: 2.0
  use_trailing: true
  max_hold_bars: 0

signals:
  rsi_low: 30
  rsi_high: 70
  trend_threshold: 0.35
  min_confirmations: 2
  exit_threshold: 0.15

indicators:
  ema_fast: 9
  ema_slow: 21
  ema_trend: 50
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_window: 20
  bb_std: 2.0
  atr_period: 14

ml:
  enabled: false          # gate entries with the ML filter (only if validation shows an edge)
  threshold: 0.55
  horizon: 48

profiles:
  Conservative:
    threshold: 0.45
    risk_per_trade: 0.005
    max_position_pct: 0.10
    max_exposure_pct: 0.30
  Normal:
    threshold: 0.35
    risk_per_trade: 0.01
    max_position_pct: 0.20
    max_exposure_pct: 0.60
  Aggressive:
    threshold: 0.25
    risk_per_trade: 0.015
    max_position_pct: 0.25
    max_exposure_pct: 0.60
