; Headless paper trading under supervisor. Adjust paths/user.
[program:onlyfunds-paper]
command=python /path/to/OnlyFunds/run_paper.py --metrics-port 8000
directory=/path/to/OnlyFunds
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/onlyfunds/paper.out.log
stderr_logfile=/var/log/onlyfunds/paper.err.log
user=your_user
environment=PYTHONUNBUFFERED="1"
